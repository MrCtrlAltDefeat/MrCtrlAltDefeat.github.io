<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Coordinating threads around shared data"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f8fb"/><stop offset="1" stop-color="#edf1f6"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b1bac6" opacity=".17"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#426f9c" stroke-width="1.5"/></marker></defs><rect width="1200" height="660" rx="18" fill="url(#bg)"/><rect width="1200" height="660" fill="url(#dots)"/><g font-family="Arial,sans-serif"><text x="65" y="75" fill="#426f9c" font-size="18" letter-spacing="3">PRODUCER–CONSUMER / POSIX THREADS</text><text x="65" y="128" fill="#242b35" font-size="36" font-weight="600">Coordinating threads around shared data</text><rect x="65" y="220" width="275" height="120" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="65" y="238" width="3" height="84" rx="2" fill="#426f9c"/><text x="89" y="263" fill="#426f9c" font-size="24" font-weight="600">Producers</text><text x="89" y="298" fill="#626d7b" font-size="18">Wait for an empty slot</text><path d="M360 280L410 280" stroke="#426f9c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="435" y="220" width="325" height="120" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="435" y="238" width="3" height="84" rx="2" fill="#426f9c"/><text x="459" y="263" fill="#426f9c" font-size="24" font-weight="600">Circular buffer</text><text x="459" y="298" fill="#626d7b" font-size="18">Mutex-protected access</text><path d="M780 280L825 280" stroke="#426f9c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="850" y="220" width="285" height="120" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="850" y="238" width="3" height="84" rx="2" fill="#5679a6"/><text x="874" y="263" fill="#5679a6" font-size="24" font-weight="600">Consumers</text><text x="874" y="298" fill="#626d7b" font-size="18">Wait for a full slot</text><rect x="438" y="375" width="57" height="52" rx="6" fill="#e7eff7" stroke="#a9bfd5"/><text x="457" y="408" fill="#426f9c" font-size="20">0</text><rect x="503" y="375" width="57" height="52" rx="6" fill="#e7eff7" stroke="#a9bfd5"/><text x="522" y="408" fill="#426f9c" font-size="20">1</text><rect x="568" y="375" width="57" height="52" rx="6" fill="#e7eff7" stroke="#a9bfd5"/><text x="587" y="408" fill="#426f9c" font-size="20">2</text><rect x="633" y="375" width="57" height="52" rx="6" fill="#e7eff7" stroke="#a9bfd5"/><text x="652" y="408" fill="#426f9c" font-size="20">3</text><rect x="698" y="375" width="57" height="52" rx="6" fill="#e7eff7" stroke="#a9bfd5"/><text x="717" y="408" fill="#426f9c" font-size="20">4</text><text x="65" y="404" fill="#426f9c" font-size="20">sem_wait(empty)</text><text x="850" y="404" fill="#5679a6" font-size="20">sem_wait(full)</text><text x="65" y="438" fill="#626d7b" font-size="18">Write → signal full</text><text x="850" y="438" fill="#626d7b" font-size="18">Read → signal empty</text><text x="445" y="467" fill="#626d7b" font-size="18">index = (index + 1) % size</text><path d="M65 514H1135" stroke="#d3dae3"/><text x="65" y="561" fill="#426f9c" font-size="16">SHUTDOWN</text><text x="220" y="561" fill="#626d7b" font-size="21">Join producers → insert one −1 per consumer → join consumers</text><text x="65" y="611" fill="#626d7b" font-size="16">Buffer shown with five slots for illustration; capacity is configurable at runtime.</text></g></svg>