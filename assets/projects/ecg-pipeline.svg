<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f5f7"/><g font-family="Arial,sans-serif"><text x="65" y="85" font-size="40" fill="#1d1d1f">Smart ECG Monitor</text><text x="65" y="125" font-size="20" fill="#73737a">Source-derived FreeRTOS pipeline · Wokwi simulation</text><rect x="65" y="180" width="515" height="165" rx="22" fill="white"/><circle cx="103" cy="220" r="13" fill="#0071e3"/><text x="130" y="227" font-size="25" fill="#1d1d1f">Acquire</text><text x="93" y="280" font-size="19" fill="#62626a">200 Hz synthetic ECG sample stream.</text><rect x="615" y="180" width="515" height="165" rx="22" fill="white"/><circle cx="653" cy="220" r="13" fill="#0071e3"/><text x="680" y="227" font-size="25" fill="#1d1d1f">Filter &amp; detect</text><text x="643" y="280" font-size="19" fill="#62626a">Pan–Tompkins processing and beat detection.</text><rect x="65" y="385" width="515" height="165" rx="22" fill="white"/><circle cx="103" cy="425" r="13" fill="#0071e3"/><text x="130" y="432" font-size="25" fill="#1d1d1f">Display &amp; alert</text><text x="93" y="485" font-size="19" fill="#62626a">OLED readout, LEDs, and buzzer feedback.</text><rect x="615" y="385" width="515" height="165" rx="22" fill="white"/><circle cx="653" cy="425" r="13" fill="#0071e3"/><text x="680" y="432" font-size="25" fill="#1d1d1f">Context &amp; logging</text><text x="643" y="485" font-size="19" fill="#62626a">IMU motion state and microSD records.</text></g></svg>