<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f5f7"/><g font-family="Arial,sans-serif"><text x="65" y="85" font-size="40" fill="#1d1d1f">Guess My Color</text><text x="65" y="125" font-size="20" fill="#73737a">Called “Match My Color” in the supplied Arduino source.</text><rect x="65" y="180" width="515" height="165" rx="22" fill="white"/><circle cx="103" cy="220" r="13" fill="#0071e3"/><text x="130" y="227" font-size="25" fill="#1d1d1f">01 / Memorize</text><text x="93" y="280" font-size="19" fill="#62626a">A target RGB color appears briefly.</text><rect x="615" y="180" width="515" height="165" rx="22" fill="white"/><circle cx="653" cy="220" r="13" fill="#0071e3"/><text x="680" y="227" font-size="25" fill="#1d1d1f">02 / Mix</text><text x="643" y="280" font-size="19" fill="#62626a">Three potentiometers set your RGB guess.</text><rect x="65" y="385" width="515" height="165" rx="22" fill="white"/><circle cx="103" cy="425" r="13" fill="#0071e3"/><text x="130" y="432" font-size="25" fill="#1d1d1f">03 / Submit</text><text x="93" y="485" font-size="19" fill="#62626a">Compare colors; score = 1000 − RGB distance.</text><rect x="615" y="385" width="515" height="165" rx="22" fill="white"/><circle cx="653" cy="425" r="13" fill="#0071e3"/><text x="680" y="432" font-size="25" fill="#1d1d1f">04 / Repeat</text><text x="643" y="485" font-size="19" fill="#62626a">Five rounds, LCD feedback, buzzer melodies.</text></g></svg>