<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="A path from surplus to pickup"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f8fb"/><stop offset="1" stop-color="#edf1f6"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b1bac6" opacity=".17"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#426f9c" stroke-width="1.5"/></marker></defs><rect width="1200" height="660" rx="18" fill="url(#bg)"/><rect width="1200" height="660" fill="url(#dots)"/><g font-family="Arial,sans-serif"><text x="65" y="75" fill="#426f9c" font-size="18" letter-spacing="3">FOODO / ODOO MODULE</text><text x="65" y="128" fill="#242b35" font-size="36" font-weight="600">A path from surplus to pickup</text><rect x="65" y="213" width="305" height="120" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="65" y="231" width="3" height="84" rx="2" fill="#426f9c"/><text x="89" y="256" fill="#426f9c" font-size="24" font-weight="600">Food batch</text><text x="89" y="291" fill="#626d7b" font-size="18">Product · quantity · expiry</text><path d="M390 273L420 273" stroke="#426f9c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="447" y="213" width="305" height="120" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="447" y="231" width="3" height="84" rx="2" fill="#426f9c"/><text x="471" y="256" fill="#426f9c" font-size="24" font-weight="600">Stock inventory</text><text x="471" y="291" fill="#626d7b" font-size="18">Product + kitchen location</text><path d="M772 273L807 273" stroke="#426f9c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="833" y="213" width="300" height="120" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="833" y="231" width="3" height="84" rx="2" fill="#5679a6"/><text x="857" y="256" fill="#5679a6" font-size="24" font-weight="600">Pickup request</text><text x="857" y="291" fill="#626d7b" font-size="18">Batch + receiver + time</text><rect x="65" y="398" width="305" height="112" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="65" y="416" width="3" height="76" rx="2" fill="#5679a6"/><text x="89" y="441" fill="#5679a6" font-size="24" font-weight="600">Receiver</text><text x="89" y="476" fill="#626d7b" font-size="18">NGO or employee</text><path d="M387 454H790V300H820" stroke="#426f9c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="833" y="398" width="300" height="112" rx="12" fill="#ffffff" stroke="#d4dce5"/><rect x="833" y="416" width="3" height="76" rx="2" fill="#426f9c"/><text x="857" y="441" fill="#426f9c" font-size="24" font-weight="600">Impact record</text><text x="857" y="476" fill="#626d7b" font-size="18">Linked to a pickup</text><text x="440" y="440" fill="#626d7b" font-size="20">Linked Odoo models</text><text x="440" y="473" fill="#626d7b" font-size="18">Python ORM + XML views</text><path d="M65 556H1135" stroke="#d3dae3"/><text x="65" y="601" fill="#626d7b" font-size="18">Implemented: stock updates and linked records. Impact values are stored fields, not verified outcomes.</text><path d="M983 341L983 390" stroke="#426f9c" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>